<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كافيه بوكي للبنات | Pookie Cozy Cafe Rush</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cafe.css" />
</head>
<body>

  <div class="cafe-app">
    <header class="cafe-header">
      <div class="brand-wrapper">
        <span class="brand-icon">☕</span>
        <h1 class="brand-title">كافيه بوكي للبنات</h1>
      </div>
    </header>

    <div class="game-stats-bar" id="gameStatsBar" style="display:none;">
      <div class="stat-item">النقاط: <span class="stat-badge" id="statScore">0</span></div>
      <div class="stat-item">الأرباح: <span class="stat-badge gold" id="statCoins">50 🪙</span></div>
      <div class="stat-item">الوقت: <span class="stat-badge timer" id="statTimer">3:00</span></div>
    </div>

    <!-- شاشة اللوبي -->
    <main class="screen-panel active" id="lobbyScreen">
      <div class="lobby-card">
        <h2 class="lobby-title">أهلاً بكِ في كافيه بوكي! 🌸</h2>
        
        <div class="player-setup-box">
          <label class="setup-label">اسمك بالكافيه:</label>
          <input type="text" class="cute-input" id="playerNameInput" value="باريستا بوكي" />

          <label class="setup-label" style="margin-top: 12px;">اختاري شخصيتك الكيوت:</label>
          <div class="avatars-row"></div>
        </div>

        <button class="btn-primary" id="startShiftBtn" style="width:100%;">🚀 ابدأ الشفت وافتح أبواب الكافيه!</button>
      </div>
    </main>

    <!-- شاشة اللعب -->
    <main class="screen-panel" id="gameScreen">
      <div class="orders-ticket-rack" id="ordersRack"></div>

      <div class="stations-nav">
        <button class="station-tab-btn active" data-station="drinks">☕ محطة المشروبات</button>
        <button class="station-tab-btn" data-station="bakery">🍰 محطة الحلويات</button>
        <button class="station-tab-btn" data-station="serving">🛎️ التسليم</button>
      </div>

      <div class="station-content-panel">
        <div class="station-step-hint" id="stationHint">اختر المكونات لتحضير الطلب!</div>
        <div class="crafting-workbench" id="craftingWorkbench">
          <div id="currentItemVisual" style="font-size:14px; color:#806875;">طاولة التحضير فارغة..</div>
        </div>
        <div class="ingredients-grid" id="ingredientsGrid"></div>
      </div>
    </main>

    <!-- شاشة النتائج -->
    <main class="screen-panel" id="resultsScreen">
      <div class="results-card">
        <h2>انتهى الشفت! 🌟</h2>
        <p>مجموع النقاط: <span id="resultScore">0</span></p>
        <button class="btn-primary" id="playAgainBtn" style="width:100%; margin-top:15px;">شفت جديد 🔄</button>
      </div>
    </main>
  </div>

  <div class="toast-shout" id="toastShout">✨ أهلاً بكِ!</div>
  <script src="cafe.js"></script>
</body>
</html>
